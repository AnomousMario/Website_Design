<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Mario</title>
        <style>
            @import url('https://fonts.cdnfonts.com/css/new-super-mario-font-u');
            body{
            margin:0;
            background-color: black;
            color:white;
            font-family: 'New Super Mario Font U', sans-serif;
            }
            .overlay {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            z-index: 99;
            background: #000;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5);
            transition: transform 0.3s ease, opacity 0.3s ease; 
            }
            input[type="checkbox"]:checked ~ .modal {
            display: block;
            }
            input[type="checkbox"]:checked ~ .overlay {
            pointer-events: auto;
            opacity: 0.8;
            transform: scale(1);
            }
            .modal{
            position:fixed;
            top:50%;
            left:50%;
            z-index:100;
            -webkit-transform:translate(-50%,-50%) scale(0.5);
            transform:translate(-50%,-50%) scale(0.5);
            width:100%;
            max-width:640px;
            pointer-events:none;
            opacity:0;
            box-sizing:border-box;
            }
            input[type="checkbox"]:checked ~ .modal{
            pointer-events: auto;
            opacity:1;
            -webkit-transform:translate(-50%,-50%) scale(1);
            transform:translate(-50%,-50%) scale(1);
            -webkit-transition:transform 0.3s ease, opacity 0.3s ease;
            transition:transform 0.3s ease, opacity 0.3s ease;
            transition-delay:0.1s;
            }
            .modal__content{
            display:block;
            padding:30px;
            background-color:#fff;
            }
            .modal__content-image{
            width:100%;
            height:auto;
            max-height:320px;
            object-fit:contain;
            margin: 15px 0;
            }
            .imgButton{
            cursor:pointer; 
            display:block; 
            width:fit-content; 
            margin:20px auto;
            }
            .imgButton:hover{
            opacity:0.7;
            transition: 0.3s;
            }
            .button-theme{
            background-color:red;
            border:none;
            color:black;
            padding:15px 32px;
            text-align:center;
            text-decoration:none;
            display:inline-block;
            font-size:16px;
            cursor:pointer;
            }
            .button-container{
            display:flex;
            justify-content:center;
            align-items:center;
            }
            .topnav{
            overflow:hidden;
            background-color:darkgray;
            }
            .topnav a{
            text-decoration:none;
            font-size:17px;
            text-align:center;
            color:black;
            display:block;
            float:left;
            }
            .topnav a active{
            background-color:red;
            color:white;
            }
            .topnav input[type=text]{
            float:right;
            padding:6px;
            border:none;
            margin-top:8px;
            margin-right:16px;
            font-size:17px;
            }
            @media screen and (max-width:600px){
            .topnav a, .topnav input[type=text]{
            float:none;
            display:block;
            text-align:left;
            width:100%;
            margin:0;
            padding:14px;
            }
            .topnav input[type=text]{
            border:1px solid #ccc
            }
            }
        </style>
    </head>
    <body>
        <h1 style="text-align:center">Clover's RPG Biography</h1>
        <div class="topnav">
            <a class="active" href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#credits">Credits</a>
            <input type="text" placeholder="Search..">
        </div>
        <input type="checkbox" id="click" style="display:none"/>
        <label for="click" class="imgButton">
        <img src="https://i.ebayimg.com/images/g/bcMAAeSwWfhqtZI8/s-l1600.webp" alt="Trigger Mario Modal" style="max-width: 300px; height: auto;" />
        </label>
        <div class="modal">
            <div class="modal__content" style="color:black;">
                <h3 style="text-align: center">Mario</h3>
                <p>Mario Mario Mario Mario Mario Mario Mario Mario Mario 
                Mario Mario Mario Mario Mario Mario Mario Mario 
                Mario Mario Mario Mario Mario Mario Mario Mario</p>
                <image class=" modal__content-image" src="https://i.ebayimg.com/images/g/bcMAAeSwWfhqtZI8/s-l1600.webp"></image>
                <label for="click" class="button">
                    <a class="button-theme button-container">Close</a>
                </label>
            </div>
        </div>
        <input type="checkbox" id="click" style="display:none"/>
        <label for="click" class="imgButton">
        <img src="https://numpaint.com/wp-content/uploads/2020/08/Funny-deadpool-adult-paint-by-numbers.jpg" alt="Trigger Mario Modal" style="max-width: 300px; height: auto;" />
        </label>
        <div class="modal">
            <div class="modal__content" style="color:black;">
                <h3 style="text-align: center">Deadpool</h3>
                <p>This is Deadpool and he is about as goofy as he can ever be.</p>
                <image class=" modal__content-image" src="https://numpaint.com/wp-content/uploads/2020/08/Funny-deadpool-adult-paint-by-numbers.jpg"></image>
                <label for="click" class="button">
                    <a class="button-theme button-container">Close</a>
                </label>
            </div>
        </div>
        <div class="overlay"></div>
    </body>
</html>

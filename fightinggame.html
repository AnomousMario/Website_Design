<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mario</title>
  <link href="https://i.ebayimg.com/images/g/oloAAeSwI1NqtZI8/s-l300.webp" type="image/x-icon" rel="icon">
  <link href="https://fonts.cdnfonts.com/css/new-super-mario-font-u" rel="stylesheet">
  <link rel="stylesheet" href="index.js">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #222; /* Optional: dark background */
    }
  @import url('https://fonts.cdnfonts.com/css/new-super-mario-font-u');
	.mario-text{
	font-family: 'New Super Mario Font U', sans-serif;
	}   
    .button-theme{
    background-color:red;
    border:none;
    color:black;
    padding:15px 32px;
    text-align:center;
    text-decoration:none;
    display:inline-block;
    font-size:16px;
    cursor:pointer;
    }
    .button-container{
    display:flex;
    justify-content:center;
    align-items:center;
	transition: transform .3s ease;
    }
    .button-container:hover{
	transform: scale(1.05);
	}
  </style>
</head>
<body>
  <!-- Main container div -->
  <div style="position: relative; display: inline-block;">
    <!-- UI Container (Flexbox) -->
    <div style="position: absolute; display: flex; width: 100%; align-items: center; padding: 20px; z-index: 10;">
      <!-- Player Health -->
      <div style="position: relative; height: 30px; width: 100%; display: flex; justify-content: flex-end;">
        <div style="background-color: red; height: 30px; width: 100%;"></div>
        <div id="playerHealth" style="position: absolute; background: yellow; top: 0; right: 0; bottom: 0; width: 100%;"></div>
      </div>
      <!-- Timer -->
      <div id="timer" style="background-color: blue; height: 100px; width: 100px; flex-shrink: 0;display:flex;align-items:center;justify-content:center;">10</div>
      <!-- Enemy Health -->
      <div style="position: relative; height: 30px; width: 100%;">
        <div style="background-color: red; height: 30px;"></div>
        <div id="enemyHealth" style="position: absolute; background: yellow; top: 0; right: 0; bottom: 0; left: 0;"></div>
      </div>
    </div>
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>
  </div>
  
  <script src="index.js"></script>

    <a href="menu.html" class="button-container button-theme mario-text">Go Back</a>
</body>
</html>

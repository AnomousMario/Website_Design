<!DOCTYPE html>

		<head>
			<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
			<title>Mario</title>	
			<style> /* CSS Class to center any object within website */
				.center-flex{
					display:flex;
					flex-direction: column;
					justify-content: center;
					align-items: center;
				}
				body {
				overflow-x: clip; /* Safer than hidden for modern rendering engines */
				min-height: 100vh; /* Use min-height instead of strict height */
				margin: 0;
				background-color: black;
				position: relative;
				}

		.sliding-link {
		display: inline-block;
		width: 150px;
		position: absolute;
		left: 0;
		opacity: 0;
		/* Removed visibility: hidden */
		}

		.sliding-link.animate {
		animation: slideAcross 3s linear forwards;
		}

		@keyframes slideAcross {
		0% {
			transform: translateX(-100%);
			opacity: 0;
		}
		10% {
			opacity: 1;
		}
		90% {
			opacity: 1;
		}
		100% {
			transform: translateX(100vw);
			opacity: 0;
		}
		}
	</style>
		</head>
		
		<body style="background-color:black;
		color:white">

			<script>
				const marioLink = document.getElementById('mario-link');
				const animationDuration = 3000;

				function spawnMario() {
					const randomTop = Math.floor(Math.random() * 80);
					marioLink.style.top = randomTop + 'vh';
					marioLink.classList.add('animate'); // Add active class
					
					setTimeout(() => {
						marioLink.classList.remove('animate'); // Remove class after run
						queueNextMario();
					}, animationDuration);
				}

				function queueNextMario() {
					const randomDelay = 2000 + Math.floor(Math.random() * 5000);
					setTimeout(() => {
						spawnMario();
					}, randomDelay);
				}

				queueNextMario();
			</script>
		</body>

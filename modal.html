<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Mario</title>
        <style>
            @import url('https://fonts.cdnfonts.com/css/new-super-mario-font-u');
            body{
            margin:0;
            background-color: black;
            color:white;
            font-family: 'New Super Mario Font U', sans-serif;
            }
            .overlay {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            z-index: 99;
            background: #000;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5);
            transition: transform 0.3s ease, opacity 0.3s ease; 
            }
            input[type="checkbox"]:checked ~ .modal {
            display: block;
            }
            input[type="checkbox"]:checked ~ .overlay {
            pointer-events: auto;
            opacity: 0.8;
            transform: scale(1);
            }
            .modal{
            position:fixed;
            top:50%;
            left:50%;
            z-index:100;
            -webkit-transform:translate(-50%,-50%) scale(0.5);
            transform:translate(-50%,-50%) scale(0.5);
            width:100%;
            max-width:640px;
            pointer-events:none;
            opacity:0;
            box-sizing:border-box;
            }
            input[type="checkbox"]:checked ~ .modal{
            pointer-events: auto;
            opacity:1;
            -webkit-transform:translate(-50%,-50%) scale(1);
            transform:translate(-50%,-50%) scale(1);
            -webkit-transition:transform 0.3s ease, opacity 0.3s ease;
            transition:transform 0.3s ease, opacity 0.3s ease;
            transition-delay:0.1s;
            }
            .modal__content{
            display:block;
            padding:30px;
            background-color:#fff;
            }
            .button-theme{
            background-color:red;
            border:none;
            color:black;
            padding:15px 32px;
            text-align:center;
            text-decoration:none;
            display:inline-block;
            font-size:16px;
            cursor:pointer;
            }
            .button-container{
            display:flex;
            justify-content:center;
            align-items:center;
            }
            .modal__content-image{
            width:100%;
            height:auto;
            max-height:320px;
            object-fit:contain;
            margin: 15px 0;
            }
        </style>
    </head>
    <body>
        <input type="checkbox" id="click" style="display:none"/>
        <label class="button" for="click">
        <a class="button-theme button-container" style="margin: 20px 420px;">The Mario Stuff</a>
        </label>
        <div class="modal">
            <div class="modal__content" style="color:black;">
                <h3 style="text-align: center">Mario</h3>
                <p>Mario Mario Mario Mario Mario Mario Mario Mario Mario 
                Mario Mario Mario Mario Mario Mario Mario Mario 
                Mario Mario Mario Mario Mario Mario Mario Mario</p>
                <image class=" modal__content-image" src="https://i.ebayimg.com/images/g/bcMAAeSwWfhqtZI8/s-l1600.webp"></image>
                <label for="click" class="button">
                    <a class="button-theme button-container">Close</a>
                </label>
            </div>
        </div>
        <div class="overlay"></div>
    </body>
</html>
